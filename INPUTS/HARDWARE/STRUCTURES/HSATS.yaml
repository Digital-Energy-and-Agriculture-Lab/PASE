StructureType:
  Value: HSATS
  Type: string
  Choices: [Agrivoltaic Fence, PV Table, HSATS]
  Definition: which type of structure for the PV modules
Material:
  Value: Metal
  Type: string
  Choices: [Metal, Wood]
  Definition: used to apply texture to the structure ;
    Metal -> grey structure
    Wood -> brown structure
PanelsPerGroup:
  Value: 2
  Type: integer
  Limit: [1, 100]
  Unit: dimensionless [-]
  Definition: Number of panels per pole in the structure
PoleShape:
  Value: Cylinder
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the pole profile
PoleWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: Pole size along x (used in case of square or rectangular pole)
PoleHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: Pole size along y (used in case of square or rectangular pole)
PoleSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in case of square pole)
PoleRadius:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole radius (used in case of cylindrical pole)
PoleLength:
  Value: 3.8
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole size along z
PoleGroundPositioning:
  Value: 0.0
  Type: float
  Limit: [-10, 0]
  Unit: meters [m]
  Definition: vertical positioning of the pole relative to the ground ;
    0 is flush with the ground, negative values mean the pole base is below
    ground level.
PoleSpacingX:
  Value: 1.0
  Type: float
  Limit: [0.2,4.0]
  Definition: Spacing between two poles on the x axis 
PurlinShape:
  Value: Cylinder
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the purlin profile
PurlinWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: purlin size along x (used in case of square or rectangular purlin)
PurlinHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: purlin size along y (used in case of square or rectangular purlin)
PurlinSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in case of square purlin)
PurlinRadius:
  Value: 0.05
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Purlin radius (used in case of cylindrical purlin)
NumberOfPurlins:
  Value: 5
  Type: integer
  Limit: [1, 10]
  Definition: Number of Purlin for one group

RafterShape:
  Value: Cylinder
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the rafter profile
RafterWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: rafter size along x (used in case of square or rectangular rafter)
RafterHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: rafter size along y (used in case of square or rectangular rafter)
RafterSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in case of square rafter)
RafterLength:
  Value: 1.8
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole size along z
RafterRadius:
  Value: 0.05
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: rafter radius (used in case of cylindrical rafter)
NumberOfRafters:
  Value: 3
  Type: integer
  Limit: [1, 10]
  Definition: Number of Rafter for one group

DiagonaleShape:
  Value: Cylinder
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the diagonale profile
DiagonaleWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: diagonale size along x (used in case of square or rectangular diagonale)
DiagonaleHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: diagonale size along y (used in case of square or rectangular diagonale)
DiagonaleSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in case of square diagonale)
DiagonaleRadius:
  Value: 0.05
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: diagonale radius (used in case of cylindrical diagonale)

StructureSpacingY:
  Value: 2.0
  Type: float
  Limit: [0.0, 50.0]
  Unit: meters [m]
  Definition: Spacing along Y
StructureHeight:
  Value: 0.0
  Type: float
  Limit: [0.0, 50.0]
  Unit: meters [m]
  Definition: Structure height
