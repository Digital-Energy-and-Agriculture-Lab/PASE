StructureType:
  Value: PV Table
  Type: string
  Choices: [Agrivoltaic Fence, PV Table]
  Definition: which type of structure for the PV modules
Material:
  Value: Wood
  Type: string
  Choices: [Metal, Wood]
  Definition: used to apply texture to the structure ;
    Metal -> grey structure
    Wood -> brown structure
NumberOfStructureGroups:
  Value: 3
  Type: integer
  Limit: [1, 100]
  Unit: dimensionless [-]
  Definition: Number of poles in one bay
PoleShape:
  Value: square
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the pole profile
PoleWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: Pole size along x (used in case of square or rectangular pole)
PoleHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: Pole size along y (used in case of square or rectangular pole)
PoleSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in case of square pole)
PoleRadius:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole radius (used in case of cylindrical pole)
PoleLength:
  Value: 3.8
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole size along z
PoleGroundPositioning:
  Value: 0.0
  Type: float
  Limit: [-10, 0]
  Unit: meters [m]
  Definition: vertical positioning of the pole relative to the ground ;
    0 is flush with the ground, negative values mean the pole base is below
    ground level.
PoleSpacingX:
  Value: 2.0
  Type: float
  Limit: [0.2,4.0]
  Unit: meters [m]
  Definition: the distance between the two poles on x axis

PurlinLength:
  Value: 2.0
  Type: float
  Limit: [0.2,4.0]
  Unit: meters [m]
  Definition: Purlin size along y
PurlinShape:
  Value: square
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the purlin profile
PurlinWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: purlin size along x (used in case of square or rectangular purlin)
PurlinHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: purlin size along y (used in case of square or rectangular purlin)
PurlinSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in case of square purlin)
PurlinRadius:
  Value: 0.05
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Purlin radius (used in case of cylindrical purlin)
NumberOfPurlins:
  Value: 5
  Type: integer
  Limit: [1, 10]
  Definition: Number of Purlin for one group

RafterShape:
  Value: square
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the rafter profile
RafterWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: rafter size along x (used in case of square or rectangular rafter)
RafterHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: rafter size along y (used in case of square or rectangular rafter)
RafterSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in case of square rafter)
RafterLength:
  Value: 3.8
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: rafter length
RafterRadius:
  Value: 0.05
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: rafter radius (used in case of cylindrical rafter)
NumberOfRafters:
  Value: 5
  Type: integer
  Limit: [1, 10]
  Definition: Number of Rafters for one group
DiagonalShape:
  Value: Cylinder
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the diagonal profile
DiagonalWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: diagonal size along x (used in case of square or rectangular diagonal)
DiagonalHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: diagonal size along y (used in case of square or rectangular diagonal)
DiagonalSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in case of square diagonal)
DiagonalRadius:
  Value: 0.05
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: diagonal radius (used in case of cylindrical diagonal)
DiagonalEpsilon:
  Value: 0.000001
  Type: float
  Limit: [0.000001, 0.000002]
  Unit: dimensionless [-]
  Definition: diagonal epsilon (used in case of cylindrical diagonal)

RepetitionDistanceGroupY:
  Value: 5.0
  Type: float
  Limit: [0.0, 50.0]
  Unit: meters [m]
  Definition: Spacing along Y
StructureHeight:
  Value: 0.0
  Type: float
  Limit: [0.0, 50.0]
  Unit: meters [m]
  Definition: Structure height
