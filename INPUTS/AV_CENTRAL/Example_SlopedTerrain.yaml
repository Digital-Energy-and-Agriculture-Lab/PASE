NumberOfPanelsX:
   Value: 1
   Type: integer
   Limit: [1, 1000]
   Unit: dimensionless [-]
   Definition: Number of panels on the x axis in one block of panels (x axis being the second potential axis of rotation of the block of panels)
NumberOfPanelsY:
   Value: 5
   Type: integer
   Limit: [1, 1000]
   Unit: dimensionless [-]
   Definition: Number of panels on the y axis in one block of panels
RepetitionDistanceOfPanelsX:
   Value: 1.31
   Type: float
   Limit: [0, 100]
   Unit: meters [m]
   Definition: Length between the repetition of 2 panels on the x axis of one block of panels
RepetitionDistanceOfPanelsY:
   Value: 2.5
   Type: float
   Limit: [0, 100]
   Unit: meters [m]
   Definition: Length between the repetition of 2 panels on the y axis of one block of panels
RotationAxisNumber:
   Value: 0
   Type: integer
   Limit: [0, 1]
   Unit: dimensionless [-]
   Definition: Number of rotation axis that drive the block of panels
TiltY:
   Value: 0
   Type: float
   Limit: [-80, 80]
   Unit: degree [°]
   Definition: Tilt of the photovoltaic block around the y axis which would be the potential main axis of rotation. The magnitude is the tilt from horizontal. The sign sets which way the panels face - positive tilts them towards CentralAzimut plus 90, negative towards CentralAzimut minus 90. See DOCUMENTATION/angle_conventions.md. The behaviour of the CentralAzimut and TiltY combination is documented with figures in the project wiki, page documentation/tutorial.
Height:
   Value: 2.3
   Type: float
   Limit: [0.1, 20]
   Unit: meters [m]
   Definition: Height from the ground to the main axis of the block of panels
NumberOfPVBlocksX:
   Value: 5
   Type: integer
   Limit: [0, 1000]
   Unit: dimensionless [-]
   Definition: Number of blocks on the x axis of the photovoltaic central (x axis being the potential second rotation axis of the block of panels)
NumberOfPVBlocksY:
   Value: 3
   Type: integer
   Limit: [0, 1000]
   Unit: dimensionless [-]
   Definition: Number of blocks on the y axis of the photovoltaic central (y axis being the potential main rotation axis of the block of panels)
RepetitionDistanceOfPVBlocksX:
   Value: 15
   Type: float
   Limit: [NumberOfPanelsX*RepetitionDistanceOfPanelsX,1000]
   Unit: meters [m]
   Definition: Length between the repetition of 2 blocks of panels on the x axis of the photovoltaic central
RepetitionDistanceOfPVBlocksY:
   Value: 30
   Type: float
   Limit: [NumberOfPanelsY*RepetitionDistanceOfPanelsY, 1000]
   Unit: meters [m]
   Definition: Length between the repetition of 2 blocks of panels on the y axis of the photovoltaic central
TwoFacetsRelativePosition:
   Value: 0.
   Type: float
   Limit: [-5, 5]
   Units: meters
   Definition: If you have to construct a PV geometry with modules having 2 facets (often 1 oriented east and the other west), it is the horizontal relative position of the panels potential rotation axis and the centre of the module with 2 facets. If there is not 2 facets, set this parameter to 0.
CentralAzimut:
   Value: 30
   Type: float
   Limit: [0,360]
   Unit: degrees [°]
   Definition: Rotation angle of the central around the z axis. This is the compass azimuth of the row axis - 0 is N ; 90 is E ; 180 is S ; 270 is W. It is not the direction the panels face; they face this azimuth plus 90 when TiltY is positive and minus 90 when it is negative, so a south-facing array is CentralAzimut 90 with a positive TiltY. See DOCUMENTATION/angle_conventions.md. The behaviour of the CentralAzimut and TiltY combination is documented with figures in the project wiki, page documentation/tutorial.
TerrainSlopeAngle:
   Value: 10
   Type: float
   Limit: [0, 60]
   Unit: degrees [°]
   Definition: The slope of the ground relative to the horizontal. 0 indicates flat ground; positive values indicate a downward slope, in the direction given by TerrainSlopeAspect - the two keys are read together. The bases of the posts are adjusted to match the ground elevation. See DOCUMENTATION/angle_conventions.md
TerrainSlopeAspect:
   Value: 180
   Type: float
   Limit: [0, 360]
   Unit: degrees [°]
   Definition: Slope direction (direction of descent), meteorological convention. 0 is N; 90 is E; 180 is S; 270 is W
